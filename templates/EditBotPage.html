<html lang="en" data-theme="dark">
  
  <head>
    <meta charset=UTF-8>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap" media="all" onload="this.media='all'">

    <script>
       window.dataLayer = window.dataLayer || [];
       function gtag(){dataLayer.push(arguments);}
       gtag('js', new Date());
       gtag('config', 'G-HJFCLE2FTR');
    </script>
    <link rel="icon" href="../../static/Images/Blackerz.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.1/css/bulma.min.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.2.13/components/button.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.0/components/icon.min.css">
    <meta name="google-site-verification" content="BV_cU5TPHg-X500ItK2v9KCVDpQVmUdAO7zAo7y9nqA" />
    <link rel="stylesheet" href="/static/CSS/home.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap">
    <script src="/static/lib/codemirror.js"></script>
    <script src="/static/lib/markdown.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap" media="all" onload="this.media='all'">
    <title>{{bot["name"]}} Dashboard</title>
</head>
  <body>
    <link rel="stylesheet" href="/static/lib/codemirror.css">
    <div id='background'></div>
    <div style="overflow:auto">
        <div class="topnav">
            <a href="/" data-text="Home" id="profiletab"></a>
            <a href="/servers" data-text="Servers"></a>
            {%- if clientUser and "username" in clientUser -%}
               <a id="discordLogin" onclick="discordLoginAPI()" data-text="{{clientUser["username"]}}"></a>
               <a id="discordLogOut" onclick="discordLogOutAPI(true)" data-text="Log out"></a>
            {%- else -%}
               <a id="discordLogin" onclick="discordLoginAPI()" data-text="Login"></a>
               <a id="discordLogOut" onclick="discordLogOutAPI(true)" style="display: none" data-text="Log out"></a>
            {%- endif -%}
        </div>
    </div>
    <section class="root-page" id="main-page">
      <h2 style="color: rgba(255,255,255, 0.85);">{{bot["name"]}} Dashboard</h1>
      <hr>
      <br>
      <form method="PUT" id="FormEdit" onsubmit="disableButton(this, true); return true">
        <div id="ShortDescription">
            <label class="input-title" for="ShortDescriptionInput" style="font-size: 120%; color: rgba(255,255,255, 0.85);">Short description <span class="required-input">*</span></label>
            <p class="input-description" style="font-size: 90%; color: rgba(255,255,255, 0.85);">Short description of your bot, max 120 characters.</p>
            <input class="input-text description" id="ShortDescriptionInput" type="text" name="ShortDescription" value="{{bot['ShortDescription']}}" placeholder="Bot short description">
            <br><br>
        </div>
        <div id="LongDescription">
            <label class="input-title" for="ShortDescriptionInput" style="font-size: 120%; color: rgba(255,255,255, 0.85);">long description <span class="required-input">*</span></label>
            <p class="input-description" style="font-size: 90%; color: rgba(255,255,255, 0.85);">Long description of your bot, max 4000 characters.</p>
            <textarea class="input-text long-description" id="LongDescriptionInput" type="text" name="LongDescription" placeholder="Bot long description">{{bot['LongDescription']}}</textarea>
            <br>
        </div>
        <input name="Authorization" hidden="" type="text" value="{{ clientData['AuthorizationV1'] }}">
        <button class="input-button submit" type="submit" value="Submit">Submit</button>
        <script>
          function disableButton(elmnt, disabl) {            
            elmnt.querySelector('button[type="submit"]').disabled = disabl != undefined ? disabl : true;
          }
          var editor = CodeMirror.fromTextArea(document.getElementById('LongDescriptionInput'), {
               mode: 'markdown',
               htmlMode: true,
               lineNumbers: true,
               lineWrapping: true,
               theme: "dark",
          });
          editor.setSize(null, '100%');
        </script>
        <script>
          document.querySelector("#FormEdit").addEventListener("submit", function(event) {
            event.preventDefault();
            var editedData = {
              "shortDescription": document.getElementById("ShortDescriptionInput").value,
              "longDescription": document.getElementById("LongDescriptionInput").value,
            }
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function(result) {
              if (this.readyState == 4 && this.status == 201) {
                 window.location.href = "https://blackerz.herokuapp.com/bots/{{bot['id']}}"
              } else if (this.readyState == 4 && this.status != 201) {
                 console.log(this.responseText)
                 try { alert(JSON.parse(this.responseText).error) } catch(er) { alert(this.responseText) }
                 disableButton(document.getElementById("FormEdit"), false)
              }
            };
            xhttp.open("PUT", "https://blackerz.herokuapp.com/api/v1/bots/{{bot['id']}}/edit", true);
            xhttp.setRequestHeader("Authorization", "{{clientData['AuthorizationV1']}}");
            xhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
            xhttp.send(JSON.stringify(editedData));
          })
        </script>
      </form>
    </section>
    <footer>
      <br>
      <div class="footer-nav">
        <div class="footer-links-holder">
                <h3 class="footer-header" style="color: rgba(255,255,255, 0.85);">Contact us</h3>
                <ul class="footer-links">
                    <li><a href="mailto:Fastering18@gmail.com">support@blackerz</a></li>
                    <li><a href="/servers/816619389809590322">Discord</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script>
       if (window.location.protocol === "http:") window.location.protocol = "https:";
       const client = JSON.parse('{{ clientUser | tojson | safe }}')
       function discordLogOutAPI(force) {
            window.location.href = window.location.origin + "/api/v1/discord/logout"
       }
       function discordLoginAPI() {
           {%- if clientUser and "username" in clientUser -%}
               window.location.href = window.location.origin + "/user/" + client.id
           {%- else -%}
               window.location.href = "/api/v1/discord/login?code=" + localStorage.getItem("stateParameter") + "&host=https://blackerz.herokuapp.com"
           {%- endif -%}
       }
    </script>
 <body>
