<!DOCTYPE html>
<html lang="en" data-theme="dark">
  
  <head>
    <meta charset=UTF-8>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap" media="all" onload="this.media='all'">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HJFCLE2FTR"></script>
    <script>
       window.dataLayer = window.dataLayer || [];
       function gtag(){dataLayer.push(arguments);}
       gtag('js', new Date());
       gtag('config', 'G-HJFCLE2FTR');
    </script>
    <link rel="icon" href="../../static/Images/Blackerz.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.1/css/bulma.min.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.2.13/components/button.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.0/components/icon.min.css">
    <meta name="google-site-verification" content="BV_cU5TPHg-X500ItK2v9KCVDpQVmUdAO7zAo7y9nqA" />
    <link rel="stylesheet" href="/static/CSS/home.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap" media="all" onload="this.media='all'">
    <title>{{bot["name"]}} Dashboard</title>
</head>
  <body>
    <div id='background'></div>
    <div style="overflow:auto">
        <div class="topnav">
            <a href="/" data-text="Home" id="profiletab"></a>
            <a href="/servers" data-text="Servers"></a>
            {%- if clientUser and "username" in clientUser -%}
               <a id="discordLogin" onclick="discordLoginAPI()" data-text="{{clientUser["username"]}}"></a>
               <a id="discordLogOut" onclick="discordLogOutAPI(true)" data-text="Log out"></a>
            {%- else -%}
               <a id="discordLogin" onclick="discordLoginAPI()" data-text="Login"></a>
               <a id="discordLogOut" onclick="discordLogOutAPI(true)" style="display: none" data-text="Log out"></a>
            {%- endif -%}
        </div>
    </div>
    <section class="root-page" id="main-page">
      <h2 style="color: rgba(255,255,255, 0.85);">{{bot["name"]}} Dashboard</h1>
      <form method="PUT" id="editform" onsubmit="disableButton(this); return true">
        <input class="input-text description" id="ShortDescription" type="text" name="ShortDescription" value="{{bot['ShortDescription']}}" placeholder="Your short description > 50 characters">
        <input name="Authorization" hidden="" type="text" value="{{ client['AuthorizationV1'] }}">
        <button class="input-button submit" type="submit" value="Submit">Submit</button>
        <script>
          function disableButton(el) {            
            el.querySelector('button[type="submit"]').disabled = true;
            console.log("submit")
          }
        </script>
      </form>
    </section>
    <footer>
      <div class="footer-nav">
        <div class="footer-links-holder">
                <h3 class="footer-header">Contact us</h3>
                <ul class="footer-links">
                    <li><a href="mailto:Fastering18@gmail.com">support@blackerz</a></li>
                    <li><a href="https://blackerz.herokuapp.com/servers/816619389809590322">Discord</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script>
       if (window.location.protocol === "http:") window.location.protocol = "https:";
       const client = JSON.parse('{{ clientUser | tojson | safe }}')
       function discordLogOutAPI(force) {
            window.location.href = window.location.origin + "/api/v1/discord/logout"
       }
       function discordLoginAPI() {
           {%- if clientUser and "username" in clientUser -%}
               window.location.href = window.location.origin + "/user/" + client.id
           {%- else -%}
               window.location.href = "https://blackerz.herokuapp.com/api/v1/discord/login?code=" + localStorage.getItem("stateParameter") + "&host=https://blackerz.herokuapp.com"
           {%- endif -%}
       }
    </script>
 <body>
